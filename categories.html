<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — FreshCart</title>
  <meta name="description" content="Browse all grocery categories at FreshCart — fruits, vegetables, dairy, snacks, beverages, personal care, and household essentials.">
  <meta name="theme-color" content="#059669">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-sidebar-header"><div class="title"><h2>Your Cart</h2><span id="cart-sidebar-badge"></span></div><button class="btn-icon" id="cart-close-btn" onclick="closeCartSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:1.25rem;height:1.25rem"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="cart-sidebar-body" id="cart-sidebar-body"></div>
    <div class="cart-sidebar-footer" id="cart-sidebar-footer" style="display:none"></div>
  </div>
  <div class="toast-container" id="toast-container"></div>

  <main>
    <div class="categories-page">
      <div class="animate-slide-up">
        <h1 style="font-family:var(--font-display);font-weight:700;font-size:1.875rem;color:var(--gray-900);margin-bottom:0.5rem">All Categories</h1>
        <p style="color:var(--gray-500);margin-bottom:2rem">Browse our wide range of grocery categories</p>
      </div>
      <div class="categories-grid stagger" id="categories-grid"></div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('categories-grid');
      if (!grid) return;
      grid.innerHTML = CATEGORIES.map(cat => `
        <a href="products.html?category=${encodeURIComponent(cat.name)}" class="card category-page-card reveal" id="category-page-${cat.slug}">
          <div class="icon-area"><span>${cat.icon}</span></div>
          <div class="text">
            <h3>${cat.name}</h3>
            <p class="desc line-clamp-2">${cat.description}</p>
            ${cat.productCount > 0 ? `<p class="count">${cat.productCount} products</p>` : ''}
          </div>
        </a>
      `).join('');
      setTimeout(initRevealAnimations, 100);
    });
  </script>
</body>
</html>
