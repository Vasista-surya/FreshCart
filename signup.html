<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — FreshCart</title>
  <meta name="description" content="Create a FreshCart account to start ordering fresh groceries, fruits, vegetables, and daily essentials.">
  <meta name="theme-color" content="#059669">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-sidebar-header"><div class="title"><h2>Your Cart</h2><span id="cart-sidebar-badge"></span></div><button class="btn-icon" id="cart-close-btn" onclick="closeCartSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:1.25rem;height:1.25rem"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="cart-sidebar-body" id="cart-sidebar-body"></div>
    <div class="cart-sidebar-footer" id="cart-sidebar-footer" style="display:none"></div>
  </div>
  <div class="toast-container" id="toast-container"></div>

  <main>
    <div class="auth-page">
      <!-- Left Panel -->
      <div class="auth-left">
        <div class="bg-blobs">
          <div class="blob blob-1"></div>
          <div class="blob blob-2"></div>
        </div>
        <div id="signup-floating-container"></div>
        <div class="auth-left-content">
          <div class="auth-mascot" id="signup-mascot">🧺</div>
          <h2 id="signup-mascot-text">Let's get you started!</h2>
          <p id="signup-mascot-subtext">Create your FreshCart account</p>
          <div id="signup-grocery-bag" style="margin-top:1rem;min-height:2rem;display:flex;flex-wrap:wrap;justify-content:center;gap:0.25rem"></div>
          <div class="auth-progress" id="signup-progress-dots" style="justify-content:center"></div>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="auth-right">
        <div class="auth-form-wrapper">
          <div class="auth-form-header">
            <a href="index.html" class="logo-link">
              <div class="nav-logo-icon" style="width:2.5rem;height:2.5rem;font-size:1.25rem">🛒</div>
              <span class="nav-logo-text" style="font-size:1.5rem">Fresh<span>Cart</span></span>
            </a>
            <h1>Create account</h1>
            <p>Start shopping fresh groceries today</p>
          </div>

          <form class="auth-form" id="signup-form">
            <div class="input-icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" class="input-field" placeholder="Full name" id="signup-name" required>
            </div>
            <div class="input-icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" class="input-field" placeholder="Email address" id="signup-email" required>
            </div>
            <div>
              <div class="input-icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                <input type="password" class="input-field" placeholder="Password" id="signup-password" required minlength="6">
                <button type="button" class="toggle-pass" id="signup-toggle-pass">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="width:1rem;height:1rem"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <p class="input-hint">Must be at least 6 characters</p>
            </div>
            <button type="submit" class="btn-primary auth-submit" id="signup-submit">Create Account</button>
          </form>

          <div class="auth-switch">
            Already have an account? <a href="login.html">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
